name: Update RSS Feed

on:
  schedule:
    # Proti 15 minute por por auto-run hobe
    - cron: '*/15 * * * *'
  workflow_dispatch: # Proyojon hole manually run korar sujog

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Scraper
        run: python fetch.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Auto-update feed every 15 minutes" || exit 0
          git push
